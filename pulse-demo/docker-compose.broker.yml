# Local MQTT broker for the Demify pulse demo.
# Published on 127.0.0.1 only: nothing on the network can reach it.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: demify-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
