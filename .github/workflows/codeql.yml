name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays at 04:23 UTC: new queries find old problems, also in weeks without a commit.
    - cron: '23 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # To hand the findings to code scanning (the Security tab).
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # The sources are analysed as they are; nothing has to be built first.
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
