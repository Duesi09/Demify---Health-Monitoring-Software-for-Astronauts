name: Release

# Runs only when a version tag such as v1.2.3 is pushed, never on ordinary pushes.
on:
  push:
    tags:
      - 'v*'

# Two runs for one tag would push the same image twice; let the first one finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Publish the container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # To push the image to the GitHub Container Registry.
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The liveness endpoint reports the version from package.json, so a tag that
      # says something else would publish an image that misstates its own version.
      - name: Check the tag against package.json
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not a version such as v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          version=$(jq --raw-output .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version. Set the version in package.json, commit, and tag that commit."
            exit 1
          fi
      # Only the last, tiny stage of the Dockerfile runs for the target platform;
      # for linux/arm64 that stage is emulated.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out image name, tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # The action writes the name in lower case, as the registry requires.
          images: ghcr.io/${{ github.repository }}
          # `latest` follows full releases only, never a pre-release such as v1.2.3-rc.1.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Demify
            org.opencontainers.image.description=Health monitoring for astronauts on long-duration missions
            org.opencontainers.image.licenses=MIT
      - name: Build and push for linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Signed statements stored next to the image: how it was built, and what is in it.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  release:
    name: Create the GitHub release
    # No release without its image.
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To create the release.
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already; nothing to do."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          flags=()
          # A version with a suffix, such as v1.2.3-rc.1, is a pre-release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Container image for linux/amd64 and linux/arm64: \`$image\`" \
            "${flags[@]}"
