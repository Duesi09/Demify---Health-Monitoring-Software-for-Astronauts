name: CI

on:
  push:
    branches: [main, "Project-*"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next typegen` writes the generated route types (PageProps, LayoutProps)
      # that a clean checkout lacks, then `tsc --noEmit` checks the whole app.
      - run: npm run typecheck
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Build must not depend on live APIs; snapshots cover it.
          DEMIFY_OFFLINE: "true"

  docker:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: demify:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container (offline mode)
        run: |
          docker run -d --name demify -p 3000:3000 -e DEMIFY_OFFLINE=true demify:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/space-weather | grep -q '"freshness":"snapshot"'
          curl -fsS -o /dev/null http://localhost:3000/
          docker logs demify
