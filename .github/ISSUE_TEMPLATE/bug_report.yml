name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the mission day (?day=) if it matters.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The version from /api/health, or the commit you run.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Today, Check-in, Earth link, Radiation, HTTP API, Storage, Container, Other]
